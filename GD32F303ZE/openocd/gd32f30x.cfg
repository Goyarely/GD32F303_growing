# GD32F303ZE (GD32F303ZET6, GD32F30x HD: Cortex-M4, 512KB Flash, 64KB SRAM)
# OpenOCD 0.12 未内置 gd32f30x target 脚本，本文件按官方 stm32f1x/stm32f4x 的写法自建。
# GD32F30x 兼容 STM32F10x 高密度 Flash 页(2KB)与解锁时序，
# 复用 stm32f1x flash 驱动，并显式指定 512KB（避免读 ST 风格 Flash Size 寄存器失败）。
#
# 用法：
#   openocd -f interface/stlink.cfg -f openocd/gd32f30x.cfg \
#           -c "program build/Debug/GD32F303ZE.hex verify" -c "reset run" -c "exit"

source [find target/swj-dp.tcl]

# 选择 SWD 传输：ST-Link(interface/stlink.cfg 用 hla 驱动)需要 hla_swd，
# 原生驱动(jlink/cmsis-dap 等)用 swd —— 两者择一可用
if {[catch {transport select hla_swd}]} {
    transport select swd
}

set _CHIPNAME gd32f30x
set _ENDIAN little

# SRAM 工作区（下载 flash 算法用，4KB）
set _WORKAREASIZE 0x1000

# GD32F303(Cortex-M4) 的 SW-DP IDCODE 固定为 0x2ba01477，必须显式指定：
# 不指定时 OpenOCD 走"扫描+校验"分支，GD32 不在其已知列表内，
# 警告之后的 AP 扫描会卡住导致 init 失败（官方 stm32f4x.cfg 同样显式指定）
adapter speed 1800
swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x2ba01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# stm32f1x 驱动 + 显式 512KB(base 0x08000000, size 0x80000)
flash bank $_CHIPNAME.flash stm32f1x 0x08000000 0x80000 0 0 $_TARGETNAME

# 复位配置：与官方 stm32f1x.cfg 同款处理（srst_nogate：SRST 存在但不门控 SWD）
reset_config srst_nogate
if {![using_hla]} {
    # 非 HLA 适配器且 srst 未连接时，用内核 SYSRESETREQ 软复位
    cortex_m reset_config sysresetreq
}
